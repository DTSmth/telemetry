[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "telemetry-sim"
version = "0.1.0"
description = "Simulated vehicle telemetry fleet with fault injection"
requires-python = ">=3.12"
dependencies = [
    "protobuf>=5.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "grpcio-tools>=1.68",
]

[project.scripts]
simulate = "telemetry_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/telemetry_sim/gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]